name: SideInstaller
options:
  # Brand reverse-DNS prefix. NOTE: this is a chosen handle only — it is NOT
  # tied to an Apple Developer account (DEVELOPMENT_TEAM stays empty below).
  bundleIdPrefix: com.frizzle
  # iOS 27 is what pairs itself; 17.4 is what the rest of the pipeline needs
  # (CoreDeviceProxy over LocalDevVPN, and the Rust core's minos), and an older
  # iPhone gets there by importing a pairing file made on a computer.
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.5"
    CURRENT_PROJECT_VERSION: "50"
    TARGETED_DEVICE_FAMILY: "1,2"
    # aws-lc-rs / idevice are arm64-only here; drop x86_64 sim slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Distribution hygiene: NO team is pinned. Whoever builds this must select
    # their OWN signing team in Xcode (Signing & Capabilities), which signs the
    # app with their account — never the original author's. Leave empty.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  SideInstaller:
    type: application
    platform: iOS
    sources:
      - path: ios-app
      # Tunnel addresses shared with the TunnelProv extension.
      - path: TunnelProv/TunnelConstants.swift
      # CIDR validation shared with the TunnelProv extension (the
      # settings UI validates the built-in tunnel's addresses with it).
      - path: TunnelProv/CIDRValidator.swift
    dependencies:
      - framework: SideInstallerFFI.xcframework
        embed: false
      # Embedded as PlugIns/SideInstallerLiveActivity.appex.
      - target: SideInstallerLiveActivity
      # Embedded as PlugIns/TunnelProv.appex (built-in loopback tunnel).
      - target: TunnelProv
    # Creating/starting our own packet-tunnel VPN configuration needs
    # the Network Extension entitlement on the app too, not just the
    # extension. Whether it survives depends on the final signing —
    # the same requirement LocalDevVPN has always had.
    entitlements:
      path: ios-app/SideInstaller.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.developer.networking.vpn.api:
          - allow-vpn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frizzle.sideinstaller
        INFOPLIST_FILE: ios-app/Info.plist
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO

  # Draws the pairing Live Activity: the code Settings asks for, in the Dynamic
  # Island and on the Lock Screen. A Live Activity's views have to live in a
  # widget extension; the app starts and updates it (PairingLiveActivity.swift).
  SideInstallerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ios-live-activity
      # What the activity shows, shared with the app.
      - path: ios-app/PairingActivityAttributes.swift
      - path: ios-app/InstallActivityAttributes.swift
    settings:
      base:
        # Has to stay the app's identifier plus a suffix, or iOS refuses to
        # install the app. Change both together.
        PRODUCT_BUNDLE_IDENTIFIER: com.frizzle.sideinstaller.LiveActivity
        INFOPLIST_FILE: ios-live-activity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The built-in loopback tunnel, ported from the open-source
  # LocalDevVPN (same 10.7.0.1 peer address minimuxer expects, same
  # packet-reflection trick). Lets Side+ open the tunnel itself
  # instead of handing over to a separately installed LocalDevVPN;
  # that app remains the fallback when the built-in tunnel can't
  # start (e.g. the entitlement didn't survive signing).
  TunnelProv:
    type: app-extension
    platform: iOS
    sources:
      - path: TunnelProv
    entitlements:
      path: TunnelProv/TunnelProv.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        # Must stay the app's identifier plus ".TunnelProv" — the app
        # looks its provider up by this exact bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.frizzle.sideinstaller.TunnelProv
        INFOPLIST_FILE: TunnelProv/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
