name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build Rust FFI
        run: |
          chmod +x build-rust.sh
          ./build-rust.sh
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project SideInstaller.xcodeproj \
            -scheme SideInstaller \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SideInstaller.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/SideInstaller.xcarchive/Products/Applications/SideInstaller.app Payload/
          zip -r SideInstaller-unsigned.ipa Payload
          shasum -a 256 SideInstaller-unsigned.ipa > SideInstaller-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-unsigned
          path: |
            SideInstaller-unsigned.ipa
            SideInstaller-unsigned.ipa.sha256
